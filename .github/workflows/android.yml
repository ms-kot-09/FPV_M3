name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.1"
      PROJECT_PATH: "godot"
      BUILD_DIR: "godot/build"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Avoid android-actions/setup-android flakiness (sdkmanager XML/version + broken pipe).
      # Use the SDK already available on ubuntu-latest runners.
      - name: Install Android packages (API 34)
        shell: bash
        run: |
          set -euo pipefail

          # On GitHub-hosted runners ANDROID_HOME/ANDROID_SDK_ROOT are usually pre-set.
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          # Locate sdkmanager
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Current ANDROID_HOME contents:"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi

          "$SDKMANAGER" --version || true

          # Accept licenses. sdkmanager sometimes closes stdin early -> 'yes' gets broken pipe.
          # Never fail the build on license accept step.
          ( yes | "$SDKMANAGER" --licenses > /dev/null ) || true

          # Install minimal packages for Godot Android export.
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot Headless
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Export Templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cd "$HOME/.local/share/godot/export_templates"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d "${GODOT_VERSION}.stable"

      - name: Prepare keystores (debug always, release optional)
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore

          # Debug keystore (always exists so export_presets doesn't break).
          keytool -genkeypair -v             -keystore keystore/debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US" || true

          # Release keystore (optional, provided via secrets).
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          fi

      - name: Import project (generate .import)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --import

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-debug "Android (Debug)" "build/NeonFPV-debug.apk"

      - name: Export Android Release AAB (if release keystore provided)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-release "Android (Release AAB)" "build/NeonFPV-release.aab"
          else
            echo "Release keystore secrets not set; skipping AAB."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeonFPV-Android
          path: |
            godot/build/*.apk
            godot/build/*.aab
