name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.1"
      PROJECT_PATH: "godot"
      BUILD_DIR: "godot/build"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages (SDK 34)
        shell: bash
        run: |
          set -e
          sdkmanager --version
          # Accept licenses (avoid failing on SIGPIPE from `yes`)
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager --install             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"

      - name: Download Godot Headless
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Export Templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cd "$HOME/.local/share/godot/export_templates"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          rm -rf "${GODOT_VERSION}.stable"
          mkdir -p "${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d "${GODOT_VERSION}.stable"

          # Godot expects templates directly under <version>.stable/
          if [ -d "${GODOT_VERSION}.stable/templates" ]; then
            mv "${GODOT_VERSION}.stable/templates/"* "${GODOT_VERSION}.stable/" || true
            rmdir "${GODOT_VERSION}.stable/templates" || true
          fi

          # Sanity check for Android templates
          test -f "${GODOT_VERSION}.stable/android_debug.apk"
          test -f "${GODOT_VERSION}.stable/android_release.apk"

      - name: Prepare keystores
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p keystore
          # Debug keystore (generated)
          keytool -genkeypair -v             -keystore keystore/debug.keystore -storepass android             -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US" || true

          # Release keystore (optional)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          fi

      - name: Import project (generate .import)
        shell: bash
        run: |
          set -e
          mkdir -p "${BUILD_DIR}"
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --import

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -e
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-debug "Android (Debug)" "build/NeonFPV-debug.apk"

      - name: Export Android Release AAB (if keystore provided)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-release "Android (Release AAB)" "build/NeonFPV-release.aab"
          else
            echo "Release keystore secrets not set; skipping AAB."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeonFPV-Android
          path: |
            godot/build/*.apk
            godot/build/*.aab
