name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.1"
      PROJECT_PATH: "godot"
      BUILD_DIR: "godot/build"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages (SDK/NDK/CMake)
        shell: bash
        run: |
          set -e
          sdkmanager_path="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true

          pkgs=(
            "platform-tools"
            "platforms;android-34"
            "build-tools;34.0.0"
            "cmdline-tools;latest"
            "cmake;3.10.2.4988404"
            "ndk;28.1.13356709"
          )

          # sdkmanager sometimes returns 141 (broken pipe) because of 'yes' piping.
          set +e
          yes | "$sdkmanager_path" "${pkgs[@]}"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 141 ]; then
            echo "sdkmanager failed with exit code $code"
            exit "$code"
          fi

      - name: Download Godot Editor (headless export)
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Export Templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cd "$HOME/.local/share/godot/export_templates"
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d "${GODOT_VERSION}.stable"

      - name: Install Android Build Template into project (Gradle)
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          SRC_ZIP="$TEMPLATE_DIR/android_source.zip"
          if [ ! -f "$SRC_ZIP" ]; then
            echo "android_source.zip not found in $TEMPLATE_DIR"
            ls -la "$TEMPLATE_DIR"
            exit 1
          fi
          mkdir -p "${PROJECT_PATH}/android/build"
          unzip -q -o "$SRC_ZIP" -d "${PROJECT_PATH}/android/build"

      - name: Prepare keystore (release optional)
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p keystore
          # Debug keystore
          keytool -genkeypair -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

          # Release keystore (optional)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          fi


      - name: Inject release keystore credentials into export_presets.cfg (only if provided)
        shell: bash
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            # Replace placeholders in export_presets.cfg (Godot does NOT expand ${VAR} automatically)
            sed -i "s/\${ANDROID_KEY_ALIAS}/$ANDROID_KEY_ALIAS/g" export_presets.cfg
            sed -i "s/\${ANDROID_KEY_PASSWORD}/$ANDROID_KEY_PASSWORD/g" export_presets.cfg
          fi

      - name: Import project (generate .import)
        shell: bash
        run: |
          set -e
          mkdir -p "${BUILD_DIR}"
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --import

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -e
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-debug "Android (Debug)" "build/NeonFPV-debug.apk"

      - name: Export Android Release AAB (if keystore secrets set)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "${PROJECT_PATH}" --export-release "Android (Release AAB)" "build/NeonFPV-release.aab"
          else
            echo "Release keystore secrets not set; skipping AAB."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeonFPV-Android
          path: |
            godot/build/*.apk
            godot/build/*.aab
